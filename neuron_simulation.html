
<!DOCTYPE html>
<html>

<head>
  <style>
    #neuron-container {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 820px;
      margin: auto;
      padding: 20px;
      background: #fdfdfd;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .btn {
      padding: 8px 16px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    #btn-receptor { background: #e67e22; color: white; }
    #btn-synapse { background: #2980b9; color: white; }
    #btn-electrode { background: #f1c40f; color: #2d3436; }
    .btn:hover { opacity: 0.9; }

    /* Sliders styling */
    .control-panel {
      display: flex;
      justify-content: space-around;
      background: #f1f2f6;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #dfe6e9;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
      color: #2c3e50;
    }
    .slider-group input {
      margin-top: 5px;
      cursor: pointer;
    }
    .slider-val {
      color: #2980b9;
    }

    /* Diagram Area with relative positioning to host the overlaid canvas */
    .diagram-area {
      position: relative;
      width: 750px;
      height: 350px;
      margin: 15px auto;
    }

    svg {
      border: 1px solid #dfe6e9;
      border-radius: 8px;
      background: #fdfaf6;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .interactive-part {
      cursor: pointer;
      transition: filter 0.2s, opacity 0.2s;
    }
    .interactive-part:hover {
      filter: brightness(1.15) drop-shadow(0px 0px 6px rgba(230, 126, 34, 0.6));
    }
    .st0{fill-rule:evenodd;clip-rule:evenodd;}
    .st1{fill-rule:evenodd;clip-rule:evenodd;fill:#304AE0;}

    /* Overlaid Oscilloscope Canvas */
    #oscilloscope {
      background: rgba(45, 52, 54, 0.85); /* Semi-transparent dark background */
      border-radius: 6px;
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 2; /* Sits directly on top of the SVG diagram */
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid #3f4446;
    }
    .info-panel {
      margin-top: 10px;
      padding: 10px;
      background: #dfe6e9;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      color: #2d3436;
      min-height: 22px;
    }
  </style>
</head>
<body>

<div id="neuron-container">
  <h2>Biophysical Neuron Stimulator (LIF Model)</h2>
  <p>Click on the components in the diagram or use the buttons below to stimulate the neuron.</p>

  <div>
    <button id="btn-synapseE1" class="btn" onclick="stimulate('synapseE1')">Trigger Synapse E1</button>
    <button id="btn-synapse" class="btn" onclick="stimulate('synapse')">Trigger Synapse E2</button>
    <button id="btn-electrode" class="btn" onclick="stimulate('electrode')">Inject Current</button>
  </div>

  <!-- Parameters Control Panel with Sliders -->
  <div class="control-panel">
    <div class="slider-group">
      <label>Membrane Capacitance (C_m): <span id="val-cm" class="slider-val">1.0</span></label>
      <input type="range" id="slider-cm" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateParams()">
    </div>
    <div class="slider-group">
      <label>Leak Conductance (g_L): <span id="val-gl" class="slider-val">0.05</span></label>
      <input type="range" id="slider-gl" min="0.01" max="0.2" step="0.01" value="0.05" oninput="updateParams()">
    </div>
    <div class="slider-group">
      <label>Synaptic Weight (d_g_syn): <span id="val-dgsyn" class="slider-val">0.02</span></label>
      <input type="range" id="slider-dgsyn" min="0.005" max="0.1" step="0.005" value="0.02" oninput="updateParams()">
    </div>
  </div>

  <!-- SVG Neuron Diagram -->
  <div class="diagram-area">

  <!-- Membrane Potential Oscilloscope Trace -->
  <canvas id="oscilloscope" width="450" height="150"></canvas>
  </div>
  <div class="info-panel" id="status-panel">System Resting: -70 mV</div>
</div>

<script>
  const canvas = document.getElementById('oscilloscope');
  const ctx = canvas.getContext('2d');
  const statusPanel = document.getElementById('status-panel');

  const width = canvas.width;
  const height = canvas.height;

  let dataPoints = Array(width).fill(-70);

  // Biophysical parameters
  let C_m = 1.0;
  let g_L = 0.05;
  const E_L = -70.0;
  const E_syn = 0.0;
  const k_syn = 0.2; // proportion decay per time step
  let d_g_syn = 0.02;

  const V_threshold = -50.0;
  const V_reset = -75.0;

  let V_m = -70.0;
  let g_syn = 0.0;
  let I_inj = 0.0;

  let refractoryTicks = 0;
  let injectionTicks = 0;
  let isSpiking = false;
  let dt = 1.0;

  function updateParams() {
    C_m = parseFloat(document.getElementById('slider-cm').value);
    g_L = parseFloat(document.getElementById('slider-gl').value);
    d_g_syn = parseFloat(document.getElementById('slider-dgsyn').value);

    document.getElementById('val-cm').innerText = C_m.toFixed(1);
    document.getElementById('val-gl').innerText = g_L.toFixed(2);
    document.getElementById('val-dgsyn').innerText = d_g_syn.toFixed(3);
  }

  function stimulate(type) {
    if (type === 'synapseE1') {
      g_syn += 0.03;
      statusPanel.innerHTML = "Receptor Triggered: Excitatory Synaptic Conductance (g_syn) opened!";
      statusPanel.style.color = "#d35400";
    } else if (type === 'electrode') {
      I_inj = 1.0;
      injectionTicks = 100;
      statusPanel.innerHTML = "Electrode Stimulated: Injecting negative current (I_inj = -2.5 pA)!";
      statusPanel.style.color = "#f39c12";
    } else if (type === 'synapse') {
      g_syn += d_g_syn;
      statusPanel.innerHTML = "Synaptic Input: Heavy depolarization triggered!";
      statusPanel.style.color = "#2980b9";
    }
  }

  function updateSimulation() {
    if (injectionTicks > 0){
      injectionTicks--;
    } else {
      I_inj = 0.0;
    }
    g_syn += (0.0 - g_syn) * k_syn;

    if (refractoryTicks > 0) {
      refractoryTicks--;
      V_m = V_reset;
      isSpiking = false;
    } else if (isSpiking) {
      V_m = V_reset;
      isSpiking = false;
      refractoryTicks = 0;
    } else {
      let dV = (g_L * (E_L - V_m) + g_syn * (E_syn - V_m) + I_inj) / C_m;
      V_m += dV * dt;

      if (V_m >= V_threshold) {
        V_m = 30.0;
        isSpiking = true;
      }
    }

    dataPoints.shift();
    dataPoints.push(V_m);
  }

  function drawTrace() {
    ctx.clearRect(0, 0, width, height);

    // Grid Lines
    ctx.strokeStyle = '#3f4446';
    ctx.lineWidth = 1;
    for(let y = 20; y < height; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();

      let mvValue = Math.round(40 - (y / height) * 140);
      ctx.fillStyle = '#8f9496';
      ctx.font = '10px monospace';
      ctx.fillText(mvValue + " mV", 5, y - 2);
    }

    // Threshold (-50 mV)
    let thresholdY = ((40 - (V_threshold)) / 140) * height;
    ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, thresholdY);
    ctx.lineTo(width, thresholdY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(231, 76, 60, 0.8)';
    ctx.fillText("Threshold", width - 70, thresholdY - 4);

    // Trace Path
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2.5;
    ctx.shadowBlur = 4;
    ctx.shadowColor = '#00ffcc';
    ctx.beginPath();

    for (let i = 0; i < width; i++) {
      let y = ((40 - dataPoints[i]) / 140) * height;
      if (i === 0) {
        ctx.moveTo(i, y);
      } else {
        ctx.lineTo(i, y);
      }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function loop() {
    updateSimulation();
    drawTrace();
    requestAnimationFrame(loop);
  }

  loop();
</script>
